<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Días hasta la semana del parcial</title>
<style>
  :root{
    --wood-dark:#5e3b1e;
    --wood-light:#8a5a30;
    --glass-stroke:#a9c9d6;
    --glass-fill:#eef7fb;
    --sand-dark:#b97a25;
    --sand-light:#e9b54e;
    --paper:#faf6ef;
    --ink:#4a3624;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    height:100%;
    font-family: Georgia, 'Times New Roman', serif;
    color:var(--ink);
  }
  .container{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:360px;
    text-align:center;
  }
  h1.legend{
    font-size:1.15rem;
    font-weight:normal;
    letter-spacing:.02em;
    margin:0 0 10px;
    color:var(--ink);
  }
  .hourglass-wrap{
    width:100%;
    max-width:280px;
    margin:0 auto;
  }
  .hourglass-wrap svg{
    width:100%;
    height:auto;
    display:block;
  }
  .days-number{
    font-size:3.6rem;
    line-height:1;
    font-weight:bold;
    color:var(--sand-dark);
    margin-top:6px;
  }
  .days-word{
    font-size:1rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.75;
    margin-top:2px;
  }
  .sub-caption{
    margin-top:14px;
    font-size:.82rem;
    line-height:1.4;
    color:var(--ink);
    opacity:.7;
  }
  .arrived-msg{
    display:none;
    margin-top:6px;
    font-size:1rem;
    font-weight:bold;
    color:var(--sand-dark);
  }

  /* --- animaciones --- */
  #neckStream{
    stroke-dasharray:5 5;
    animation:flow 0.5s linear infinite;
  }
  @keyframes flow{
    to{ stroke-dashoffset:-10; }
  }
  .grain{
    animation:fall 1.1s linear infinite;
  }
  @keyframes fall{
    0%{  transform:translateY(0);   opacity:0; }
    10%{ opacity:1; }
    85%{ opacity:1; }
    100%{transform:translateY(26px); opacity:0; }
  }
  svg.empty #neckStream,
  svg.empty .grain{
    animation-play-state:paused;
    opacity:0;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1 class="legend">Días hasta la semana del parcial</h1>

      <div class="hourglass-wrap">
        <svg id="hourglass" viewBox="0 0 300 580" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <clipPath id="clipTop">
              <polygon points="72,44 228,44 150,272" />
            </clipPath>
            <clipPath id="clipBottom">
              <polygon points="150,288 72,516 228,516" />
            </clipPath>
            <linearGradient id="sandGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--sand-light)"/>
              <stop offset="100%" stop-color="var(--sand-dark)"/>
            </linearGradient>
            <linearGradient id="woodGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="var(--wood-light)"/>
              <stop offset="100%" stop-color="var(--wood-dark)"/>
            </linearGradient>
            <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6"/>
            </filter>
          </defs>

          <!-- sombra -->
          <ellipse cx="150" cy="556" rx="110" ry="10" fill="#000" opacity="0.15" filter="url(#softShadow)"/>

          <!-- pilares laterales -->
          <rect x="56" y="42" width="7" height="478" fill="url(#woodGrad)" rx="2"/>
          <rect x="237" y="42" width="7" height="478" fill="url(#woodGrad)" rx="2"/>

          <!-- tapa inferior de madera -->
          <rect x="48" y="518" width="204" height="24" rx="8" fill="url(#woodGrad)"/>
          <!-- tapa superior de madera -->
          <rect x="48" y="20" width="204" height="24" rx="8" fill="url(#woodGrad)"/>

          <!-- vidrio (contorno) -->
          <polygon points="72,44 228,44 150,272 150,288 228,516 72,516 150,288 150,272"
                   fill="var(--glass-fill)" stroke="var(--glass-stroke)" stroke-width="2"
                   stroke-linejoin="round" opacity="0.55"/>

          <!-- arena superior -->
          <rect id="sandTop" x="72" width="156" fill="url(#sandGrad)" clip-path="url(#clipTop)"/>
          <!-- arena inferior -->
          <rect id="sandBottom" x="72" width="156" fill="url(#sandGrad)" clip-path="url(#clipBottom)"/>

          <!-- reflejo de vidrio -->
          <polygon points="90,50 130,50 108,140" fill="#ffffff" opacity="0.25"/>
          <polygon points="228,300 210,340 228,500" fill="#ffffff" opacity="0.12"/>

          <!-- chorrito en el cuello -->
          <line id="neckStream" x1="150" y1="272" x2="150" y2="288" stroke="var(--sand-dark)" stroke-width="3"/>

          <!-- granos cayendo -->
          <circle class="grain" cx="150" cy="276" r="2.2" fill="var(--sand-dark)" style="animation-delay:0s"/>
          <circle class="grain" cx="149" cy="276" r="1.8" fill="var(--sand-light)" style="animation-delay:.35s"/>
          <circle class="grain" cx="151" cy="276" r="1.8" fill="var(--sand-dark)" style="animation-delay:.7s"/>
        </svg>
      </div>

      <div class="days-number" id="daysNumber">--</div>
      <div class="days-word">días</div>
      <div class="arrived-msg" id="arrivedMsg">¡Llegó la semana del parcial!</div>

      <div class="sub-caption">
        Primer parcial · semana del 21 al 25 de septiembre<br>
        Comisión A: martes 22/09, 14 a 16 hs · Comisión B: viernes 25/09, 10.15 a 12.15 hs
      </div>
    </div>
  </div>

<script>
  // Ajustar estas dos fechas si se reutiliza el reloj otro año/parcial:
  // ANCHOR = fecha desde la que se considera "lleno" (100% de arena arriba)
  // TARGET = fecha en la que debe quedar vacío (inicio de la semana del parcial)
  var ANCHOR = new Date(2026, 8, 6, 0, 0, 0);   // 6 de septiembre de 2026
  var TARGET = new Date(2026, 8, 21, 0, 0, 0);  // 21 de septiembre de 2026

  var svg = document.getElementById('hourglass');
  var sandTop = document.getElementById('sandTop');
  var sandBottom = document.getElementById('sandBottom');
  var daysNumber = document.getElementById('daysNumber');
  var arrivedMsg = document.getElementById('arrivedMsg');

  var TOP_Y = 44, NECK_Y = 272, BASE_Y = 516, APEX_Y = 288;
  var H_TOP = NECK_Y - TOP_Y;      // 228
  var H_BOTTOM = BASE_Y - APEX_Y;  // 228

  function update(){
    var now = new Date();
    var totalMs = TARGET - ANCHOR;
    var remainMs = TARGET - now;
    var fraction = totalMs > 0 ? remainMs / totalMs : 0;
    if (fraction < 0) fraction = 0;
    if (fraction > 1) fraction = 1;

    var topH = fraction * H_TOP;
    sandTop.setAttribute('y', TOP_Y + (H_TOP - topH));
    sandTop.setAttribute('height', topH);

    var bottomH = (1 - fraction) * H_BOTTOM;
    sandBottom.setAttribute('y', BASE_Y - bottomH);
    sandBottom.setAttribute('height', bottomH);

    var daysRemaining = Math.max(0, Math.ceil(remainMs / 86400000));
    daysNumber.textContent = daysRemaining;

    if (fraction <= 0) {
      svg.classList.add('empty');
      arrivedMsg.style.display = 'block';
    } else {
      svg.classList.remove('empty');
      arrivedMsg.style.display = 'none';
    }
  }

  update();
  setInterval(update, 1000);
</script>
</body>
</html>
